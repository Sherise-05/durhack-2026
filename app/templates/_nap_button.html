{# "Nap now": starts a nap timer straight away, with a short reason for its length and alarm. #}
<div class="nap-widget" data-nap-widget data-state="idle">
    <button class="nap-button" type="button" data-nap-main aria-live="polite">
        <span class="nap-button-icon" aria-hidden="true" data-nap-icon>☾</span>
        <span class="nap-button-text">
            <small data-nap-eyebrow>Tired right now?</small>
            <strong data-nap-title>Nap now</strong>
            <small data-nap-sub>Doze sets the alarm for you</small>
        </span>
    </button>
    <div class="nap-panel" data-nap-panel hidden>
        <div class="nap-reason">
            <p class="nap-reason-label" data-nap-reason-label>Why this timing</p>
            <p data-nap-reason>Thinking about your day…</p>
        </div>
        <ul class="notice warning" data-nap-warnings hidden></ul>
        <div class="action-row">
            <button class="button secondary" type="button" data-nap-cancel>Cancel nap</button>
        </div>
    </div>
    <noscript><p><a href="/nap-planner">Open the nap planner</a> to see a nap recommendation.</p></noscript>
</div>
